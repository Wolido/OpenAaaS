[project]
name = "open-aaas-dashboard"
version = "0.5.1"
description = "OpenAaaS Dashboard - A Streamlit-based web UI for monitoring tasks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "IDM Explorer Lab"}
]
keywords = ["oaas", "dashboard", "streamlit", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "toml>=0.10.2",
    "streamlit-autorefresh>=1.0.0",
    # Security: override streamlit's transitive dependency to fix 8 CVEs (GHSA-2f96-g7mh-g2hx, GHSA-v396-v7q4-x2qj, GHSA-956x-8gvw-wg5v, GHSA-3rp5-jjmw-4wv2, GHSA-fjr4-x663-mwxc, GHSA-6p8h-3wgx-97gf, GHSA-r9mr-m37c-5fr3, GHSA-94p4-4cq8-9g67)
    "gitpython>=3.1.55",
]

[project.scripts]
aaas-dashboard = "aaas_dashboard.__main__:main"

[project.urls]
Homepage = "https://github.com/Wolido/OpenAaaS/dash"
Repository = "https://github.com/Wolido/OpenAaaS/dash"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaas_dashboard"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
    "freezegun>=1.2.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.0.2",
    "responses>=0.26.0",
]
