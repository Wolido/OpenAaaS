[package]
name = "openaaas-client"
version = "0.7.1"
description = "OpenAaaS Desktop Client"
authors = ["OpenAaaS"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pin time to avoid E0119 conflict with tauri-utils 2.9.2
# See: https://github.com/Wolido/OpenAaaS/issues/123
# Remove once tauri-utils fixes the trait conflict or tauri is upgraded.
time = "=0.3.53"

[features]
custom-protocol = ["tauri/custom-protocol"]
