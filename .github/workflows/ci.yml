name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust
      - name: Run server tests
        run: |
          cd server
          cargo test
      - name: Run agent-core tests
        run: |
          cd agent-core
          cargo test --features test-utils
      - name: Run admin-cli tests
        run: |
          cd admin-cli
          cargo test

  rust-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: server
            dir: server
          - component: agent-core
            dir: agent-core
            feature: test-utils
          - component: admin-cli
            dir: admin-cli
          - component: client-app/src-tauri
            dir: client-app/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-${{ matrix.component }}
          workspaces: ${{ matrix.component == 'client-app/src-tauri' && 'client-app/src-tauri' || '' }}
      - name: Install Tauri dependencies
        if: matrix.component == 'client-app/src-tauri'
        uses: ./.github/actions/install-tauri-deps
      - name: Check formatting
        working-directory: ${{ matrix.dir }}
        run: cargo fmt --check
      - name: Run clippy
        working-directory: ${{ matrix.dir }}
        run: cargo clippy --all-targets ${{ matrix.feature && format('--features {0}', matrix.feature) }} -- -D warnings

  security-audit:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-security-audit
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: '0.11.24'
      # cargo-audit 0.21.2 cannot parse CVSS 4.0 entries in the current advisory DB,
      # so we pin to 0.22.2 which handles them correctly.
      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.2 --locked
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # Rust 组件依赖安全扫描（统一在仓库根目录读取 .cargo/audit.toml）
      # Known unfixable RUSTSEC-2023-0071 is managed in .cargo/audit.toml.
      # New vulnerabilities will still fail this job.
      - name: cargo audit (server)
        run: cargo audit --file server/Cargo.lock
      - name: cargo audit (agent-core)
        run: cargo audit --file agent-core/Cargo.lock
      - name: cargo audit (admin-cli)
        run: cargo audit --file admin-cli/Cargo.lock
      - name: cargo audit (client-app/src-tauri)
        run: cargo audit --file client-app/src-tauri/Cargo.lock

      # Python 项目依赖安全扫描
      # uv-managed projects: export runtime requirements from uv.lock (or resolved on demand)
      # and audit the resulting requirements file for accurate, reproducible scanning.
      - name: pip-audit (pyopenaaas)
        working-directory: pyopenaaas
        run: |
          uv export --format requirements-txt --no-dev --no-editable --no-hashes > /tmp/requirements-pyopenaaas.txt
          pip-audit -r /tmp/requirements-pyopenaaas.txt
      - name: pip-audit (dash)
        working-directory: dash
        run: |
          uv export --format requirements-txt --no-dev --no-editable --no-hashes > /tmp/requirements-dash.txt
          pip-audit -r /tmp/requirements-dash.txt
      - name: pip-audit (openaaas-mcp-adapter)
        working-directory: openaaas-mcp-adapter
        run: |
          uv export --format requirements-txt --no-dev --no-editable --no-hashes > /tmp/requirements-mcp-adapter.txt
          pip-audit -r /tmp/requirements-mcp-adapter.txt
      - name: pip-audit (binder)
        working-directory: binder
        run: pip-audit -r requirements.txt

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-app/src-tauri
      - uses: ./.github/actions/install-tauri-deps
      - name: Run frontend tests
        run: |
          cd client-app
          npm ci
          npm run test
      - name: Build frontend
        run: |
          cd client-app
          npm run build
      - name: Run Tauri Rust tests
        run: |
          cd client-app/src-tauri
          cargo test

  python-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # mcp-adapter
      - name: Test mcp-adapter
        run: |
          cd openaaas-mcp-adapter
          pip install -e ".[dev]"
          pytest tests/ -v

      # pyopenaaas SDK
      - name: Test pyopenaaas SDK
        run: |
          cd pyopenaaas
          pip install -e .
          pip install pytest pytest-asyncio respx
          pytest tests/ -v

      # dash (仅 Linux)
      - name: Test dash
        if: runner.os == 'Linux'
        run: |
          cd dash
          pip install -e ".[dev]"
          pytest tests/ -v
